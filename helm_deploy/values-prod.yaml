---
# Per environment values which override defaults in hmpps-prisoner-finance-general-ledger-api/values.yaml

generic-service:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

  ingress:
    host: prisoner-finance-general-ledger-api.hmpps.service.justice.gov.uk
    # modsecurity_enabled: true

  env:
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
    JAVA_OPTS: ""
    DB_POOL_SIZE: "30" # t4g.small instance - 171 total connections, 4 pods (+1), 150 total connections used
    HMPPS_AUTH_URL: "https://sign-in.hmpps.service.justice.gov.uk/auth"

  allowlist:
    # Configure groups as appropriate to give the minimum ingress access required:
    #   global_protect: devices using the global_protect proxy
    #   moj_cloud_platform: services on Cloud Platform
    # Other IP allowlist groups are here:
    # https://github.com/ministryofjustice/hmpps-ip-allowlists/blob/main/ip-allowlist-groups.yaml

    groups:
      - global_protect
      - moj_cloud_platform

  # NOTE: Removing ALL allowlist groups will make the application accessible from the internet.
  #       If you are intending to do this, please ensure you uncomment the 'modsecurity_enabled=true'
  #       entry in the ingress above. This will enable WAF protection of the endpoint. You will need
  #       to configure modsecurity rules to suit your needs. Further information can be found here:
  #       https://user-guide.cloud-platform.service.justice.gov.uk/documentation/networking/modsecurity.html#modsecurity-web-application-firewall

  postgresDatabaseRestore:
    jobName: "hmpps-prisoner-finance-gl-api-postgres-restore"
    backupJobName: "hmpps-prisoner-finance-gl-api-pg-backup"
    enabled: true
    timeout: 3590
    namespace_secrets:
      rds-postgresql-instance-output:
        DB_NAME: "database_name"
        DB_USER: "database_username"
        DB_PASS: "database_password"
        DB_HOST: "rds_instance_address"
      rds-postgresql-instance-output-preprod:
        DB_NAME_PREPROD: "database_name"
        DB_USER_PREPROD: "database_username"
        DB_PASS_PREPROD: "database_password"
        DB_HOST_PREPROD: "rds_instance_address"
      s3-db-restore-bucket:
        BUCKET_NAME: "bucket_name"

# CloudPlatform AlertManager receiver to route prometheus alerts to slack
# See https://user-guide.cloud-platform.service.justice.gov.uk/documentation/monitoring-an-app/how-to-create-alarms.html#creating-your-own-custom-alerts
generic-prometheus-alerts:
  alertSeverity: prisoner-finance-alerts-prod
